<text x="24" y="80" fill="#f0f4f6" font-family="Arial" font-size="18">Internal operations</text>
<text x="24" y="123" fill="#9fb1bb" font-family="Arial" font-size="16">• inventory + pricing</text>
<text x="24" y="151" fill="#9fb1bb" font-family="Arial" font-size="16">• clients + leads</text>
<text x="24" y="179" fill="#9fb1bb" font-family="Arial" font-size="16">• sales + contracts</text>
<text x="24" y="207" fill="#9fb1bb" font-family="Arial" font-size="16">• photos + transit</text>
<text x="24" y="235" fill="#66df91" font-family="Arial" font-size="16" font-weight="700">full private state</text>
</g>

