<text x="24" y="151" fill="#9fb1bb" font-family="Arial" font-size="16">• filtering + pagination</text>
<text x="24" y="179" fill="#9fb1bb" font-family="Arial" font-size="16">• public-safe fields only</text>
<text x="24" y="207" fill="#9fb1bb" font-family="Arial" font-size="16">• separate rate limits</text>
<text x="24" y="235" fill="#66df91" font-family="Arial" font-size="16" font-weight="700">no private commissions</text>
</g>

