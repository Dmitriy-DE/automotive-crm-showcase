<rect width="1600" height="480" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1598" height="478" rx="25" fill="none" stroke="#1d5266"/>
<text x="48" y="58" fill="#16d9ff" font-family="monospace" font-size="24" font-weight="700">ONE DOMAIN · MULTIPLE DELIVERY CHANNELS</text>
<text x="48" y="92" fill="#a8bcc8" font-family="Arial" font-size="21">The same vehicles, clients and sales are reused across internal and public surfaces. Business rules stay on the server.</text>

<g transform="translate(45 135)">
<rect width="300" height="270" rx="18" fill="#0a1720" stroke="#2fe3b0"/>
