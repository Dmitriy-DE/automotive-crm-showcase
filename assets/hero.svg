<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050c12"/><stop offset=".6" stop-color="#07131b"/><stop offset="1" stop-color="#090f15"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#0d2430"/></pattern></defs><rect width="1600" height="520" rx="28" fill="url(#bg)"/><rect width="1600" height="520" rx="28" fill="url(#grid)" opacity=".3"/><rect x="1" y="1" width="1598" height="518" rx="27" fill="none" stroke="#1d5266"/><text x="44" y="50" fill="#16d9ff" font-family="monospace" font-size="15">› avtosvitcrm / automotive-crm-showcase</text><text x="44" y="120" fill="#f4f8fb" font-family="Arial" font-size="68" font-weight="800">Automotive CRM</text><text x="44" y="163" fill="#b8cad4" font-family="Arial" font-size="21">Operational CRM for automotive inventory, clients, sales and public channels.</text><text x="44" y="198" fill="#879eaa" font-family="Arial" font-size="17">Staff web, public API, Telegram bots, four Mini Apps and scheduled publishing share one operational state.</text><rect x="44" y="234" width="815" height="96" rx="15" fill="#08141d" stroke="#1d5266"/><text x="65" y="264" fill="#ffb547" font-family="monospace" font-size="10">OPERATING RULE</text><text x="65" y="302" fill="#f4f8fb" font-family="Arial" font-size="30" font-weight="800">One business state. Many channels.</text><text x="65" y="323" fill="#879eaa" font-family="Arial" font-size="11">If web, API, bot and Mini App touch the same state, the server owns the rule once.</text><g transform="translate(44 360)"><rect width="156" height="38" rx="8" fill="#081722" stroke="#1d5266"/><text x="78" y="24" text-anchor="middle" fill="#2fe3b0" font-family="monospace" font-size="10">Node.js 18</text></g><g transform="translate(214 360)"><rect width="156" height="38" rx="8" fill="#081722" stroke="#1d5266"/><text x="78" y